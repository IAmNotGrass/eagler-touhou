name: App
# Builds the Tauri app (tauri/) for Windows and macOS. Run it by hand from the
# Actions tab, or push a tag such as app-v0.1.0 to also draft a GitHub release
# with the installers. The pages come from this commit; the game list and card
# artwork come from the content site, which the app also downloads games from.
'on':
  workflow_dispatch: null
  push:
    tags:
    - app-v*
permissions:
  contents: read
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true
env:
  # Accounts and play.
  EAGLER_APP_SERVICE_ORIGIN: https://lograss.top
  # The game list, card artwork and the games the app downloads.
  EAGLER_APP_CONTENT_ORIGIN: https://touhou.vip
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: windows
          runner: windows-latest
          rust-targets: ''
          tauri-args: ''
          bundles: |
            tauri/src-tauri/target/release/bundle/msi/*.msi
            tauri/src-tauri/target/release/bundle/nsis/*.exe
        - name: macos
          runner: macos-latest
          # One app for Apple silicon and Intel Macs.
          rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          tauri-args: --target universal-apple-darwin
          bundles: |
            tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: |
          launcher/package-lock.json
          tauri/package-lock.json
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.rust-targets }}
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: tauri/src-tauri -> target
    - name: Build the launcher pages
      run: |
        npm ci --prefix launcher --no-audit --no-fund
        npm run build:ui-rewrite --prefix launcher
    - name: Build the app
      working-directory: tauri
      run: |
        npm ci --no-audit --no-fund
        npx tauri build ${{ matrix.tauri-args }}
    - uses: actions/upload-artifact@v7
      with:
        name: eagler-touhou-${{ matrix.name }}
        path: ${{ matrix.bundles }}
        if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: bundles
        merge-multiple: true
    - name: Draft the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" bundles/* --repo "$GITHUB_REPOSITORY" --draft --title "Eagler Touhou ${GITHUB_REF_NAME#app-v}" --notes "Windows (.msi / setup .exe) and macOS (.dmg, Apple silicon and Intel) builds of the Eagler Touhou app."
