[package]
name = "eagler-touhou"
version = "0.1.0"
description = "Eagler Touhou launcher"
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "eagler_touhou_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
